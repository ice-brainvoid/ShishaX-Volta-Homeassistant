name: Validate

on:
  push:
  pull_request:
  schedule:
    # Weekly, so upstream changes in hassfest or HACS surface on their own.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
        env:
          # The action reads hacs.json, manifest.json, the description and the
          # topics back through the GitHub API rather than from the checkout.
          # Without a token those requests come back empty, which surfaces as
          # "expected a dictionary. Got None" on every one of those checks.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      # The codec has no Home Assistant dependency, so it runs standalone.
      - run: pytest tests/ -q
