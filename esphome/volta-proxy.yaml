# Bluetooth proxy for the VOLTA.
#
# Use this when Home Assistant has no Bluetooth adapter of its own, or is too
# far from the device - for example when it runs in a VM or container. This
# ESP32 establishes the BLE connection and forwards it to Home Assistant.
# Place it in the same room as the hookah.
#
# Important: bluetooth_proxy needs "active: true". Only then are real GATT
# connections possible; without it only advertisements are forwarded and the
# integration cannot write anything.

esphome:
  name: volta-proxy
  friendly_name: VOLTA Proxy

esp32:
  board: esp32dev
  framework:
    # ESP-IDF rather than Arduino: noticeably more stable with many BLE connections.
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi drops, the proxy opens its own access point.
  ap:
    ssid: "VOLTA Proxy Fallback"
    password: !secret fallback_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true
