# Bluetooth proxy for the VOLTA.
#
# Use this when Home Assistant has no Bluetooth adapter of its own, or is too
# far from the device - for example when it runs in a VM or container. This
# ESP32 establishes the BLE connection and forwards it to Home Assistant.
# Place it in the same room as the hookah.
#
# Important: bluetooth_proxy needs "active: true". Only then are real GATT
# connections possible; without it only advertisements are forwarded and the
# integration cannot write anything.

esphome:
  name: volta-proxy
  friendly_name: VOLTA Proxy

esp32:
  board: esp32dev
  framework:
    # ESP-IDF rather than Arduino: noticeably more stable with many BLE connections.
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The ESP32 shares one antenna between Wi-Fi and Bluetooth. Letting Wi-Fi
  # sleep between beacons adds latency spikes on top of that contention, and
  # Home Assistant reaches this proxy over Wi-Fi - a stall there drops every
  # Bluetooth connection that runs through it.
  power_save_mode: none
  # If Wi-Fi drops, the proxy opens its own access point.
  ap:
    ssid: "VOLTA Proxy Fallback"
    password: !secret fallback_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    # Not the usual 1100ms/1100ms. Equal values mean scanning 100 % of the time,
    # which on this single-radio chip starved Wi-Fi so badly that a third of
    # all packets were lost and the API link to Home Assistant kept stalling -
    # taking the Bluetooth connection down with it every time. Roughly 9 % scan
    # duty is plenty to spot a known device's advertisements and leaves the
    # radio free for the connection and for Wi-Fi.
    interval: 320ms
    window: 30ms
    active: true

bluetooth_proxy:
  active: true

sensor:
  # The proxy's own Wi-Fi strength, shown in Home Assistant. When Bluetooth
  # connections keep dropping, this is the first thing to look at.
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
